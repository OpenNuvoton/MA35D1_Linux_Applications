[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "muse-genui"
version = "0.1.0"
description = "Generative presentation API layered on the Meta Muse Gadgets Linux SDK"
requires-python = ">=3.10"
license = {file = "LICENSE"}

[tool.setuptools.packages.find]
where = ["src"]
